[project]
name = "osmu-cjc-flet"
version = "0.1.0"
description = "씨제이씨협동조합 OSMU 워크벤치 — Flet 데스크톱 앱"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "playwright>=1.46",
    "pyperclip>=1.9",
    "Pillow>=10.0",
    "pywin32; platform_system == 'Windows'",
]

[tool.flet]
product = "OSMU CJC 워크벤치"
org = "cjc"
company = "cjc"

# flet 1.0.2의 빌드 템플릿은 Flutter 패키지 jni를 1.0.0으로 고정(override)하는데,
# 2026-10-06에 나온 jni_flutter 1.0.4+1은 jni ^1.1.0을 요구해 Dart 컴파일이
# "Constant evaluation error"로 깨졌다(10/02 빌드는 성공, 10/15 빌드 실패).
# 성공했던 빌드가 쓰던 1.0.4(jni ^1.0.0)로 고정한다. flet을 jni 1.1.0을 쓰는
# 버전으로 올릴 때 이 고정도 같이 풀면 된다.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.4"

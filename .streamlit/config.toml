# assets/custom.css 는 배경(한지)과 글자(먹)를 밝은 팔레트로 고정합니다.
# 커스텀 테마가 없으면 Streamlit 은 브라우저/OS 의 다크모드 설정을 따라가 글자색만
# #FAFAFA 로 바뀌고, 그 결과 밝은 배경 위에 흰 글씨가 되어 본문이 보이지 않았습니다.
# 여기서 테마를 고정하면 브라우저 설정과 무관하게 CSS 와 같은 팔레트가 적용됩니다.
# 값은 core/brand_seed.BRAND_COLORS 와 1:1 대응합니다.
[theme]
base = "light"
primaryColor = "#A6224B"
backgroundColor = "#FBF7F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B2118"
